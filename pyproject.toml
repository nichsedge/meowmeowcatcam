[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meowmeowcatcam"
version = "0.1.0"
description = "Webcam gesture to cat meme detector"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mediapipe>=1.0.0",
    "numpy>=2.0.0",
    "opencv-contrib-python>=4.10.0",
]

[project.scripts]
meowmeowcatcam = "gesture_meme:main"

[tool.hatch.build.targets.wheel]
include = [
    "gesture_meme.py",
    "main.py",
]
